name: V7 transaction journal and recovery protocol
on:
  pull_request:
    paths:
      - 'ci/v7/transaction-coordinator.mjs'
      - 'ci/v7/transaction-coordinator.test.mjs'
      - '.github/workflows/v7-transaction-protocol.yml'
  push:
    branches: [main]
    paths:
      - 'ci/v7/transaction-coordinator.mjs'
      - 'ci/v7/transaction-coordinator.test.mjs'
      - '.github/workflows/v7-transaction-protocol.yml'
permissions:
  contents: read
jobs:
  transaction-protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test ci/v7/transaction-coordinator.test.mjs

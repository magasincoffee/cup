name: V7 Owner QA offline negative authorization
on:
  pull_request:
    paths:
      - 'ci/v7/private-owner-negative-auth.test.mjs'
      - 'ci/v7/private-owner-read-bridge.js'
      - '.github/workflows/v7-negative-auth.yml'
  push:
    branches: [main]
    paths:
      - 'ci/v7/private-owner-negative-auth.test.mjs'
      - 'ci/v7/private-owner-read-bridge.js'
      - '.github/workflows/v7-negative-auth.yml'
permissions:
  contents: read
jobs:
  negative-auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test ci/v7/private-owner-negative-auth.test.mjs

name: V7 transaction readiness offline gates
on:
  pull_request:
    paths:
      - 'ci/v7/transaction-gates.mjs'
      - 'ci/v7/transaction-gates.test.mjs'
      - '.github/workflows/v7-transaction-gates.yml'
      - 'v7-preview/logic.js'
  push:
    branches: [main]
    paths:
      - 'ci/v7/transaction-gates.mjs'
      - 'ci/v7/transaction-gates.test.mjs'
      - '.github/workflows/v7-transaction-gates.yml'
      - 'v7-preview/logic.js'
permissions:
  contents: read
jobs:
  transaction-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test ci/v7/transaction-gates.test.mjs

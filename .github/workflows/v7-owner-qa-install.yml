name: MAGASIN CUP V7 new Owner QA read bridge
on:
  push:
    branches: [main]
    paths:
      - 'ci/v7/qa-safe-install-guard.mjs'
      - 'ci/v7/qa-safe-install-guard.test.mjs'
      - 'ci/v7/run-qa-safe-install.mjs'
      - 'ci/v7/private-owner-read-bridge.js'
      - '.github/workflows/v7-owner-qa-install.yml'
  pull_request:
    paths:
      - 'ci/v7/qa-safe-install-guard.mjs'
      - 'ci/v7/qa-safe-install-guard.test.mjs'
      - 'ci/v7/run-qa-safe-install.mjs'
      - 'ci/v7/private-owner-read-bridge.js'
      - '.github/workflows/v7-owner-qa-install.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only preflight first; installation requires separate explicit confirmation
        type: choice
        required: true
        default: preflight
        options: [preflight, install]
      confirm:
        description: For installation only enter INSTALL_V7_QA_READONLY
        required: false
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: cup-t015-google-owner-qa
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check ci/v7/qa-safe-install-guard.mjs
      - run: node --check ci/v7/run-qa-safe-install.mjs
      - run: node --check ci/v7/private-owner-read-bridge.js
      - run: node --test ci/v7/qa-safe-install-guard.test.mjs
      - run: node --test ci/v7/private-owner-read-bridge.test.mjs
  owner-qa-only:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cup-t015-qa
    env:
      ACTION_MODE: ${{ inputs.mode }}
      ACTION_CONFIRM: ${{ inputs.confirm }}
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g --ignore-scripts @google/clasp@3.4.1
      - name: Verify new QA script source, optionally install bridge, no execution
        run: node ci/v7/run-qa-safe-install.mjs

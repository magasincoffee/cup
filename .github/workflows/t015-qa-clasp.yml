name: MAGASIN CUP T015 source checks
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/t015-qa-clasp.yml'
      - 'ci/t015/**'
  pull_request:
    paths:
      - '.github/workflows/t015-qa-clasp.yml'
      - 'ci/t015/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node ci/t015/test_t015_order_triage.cjs
      - run: node ci/t015/test-qa-patch.mjs
      - run: node --test ci/t015/fault-recovery.test.mjs
      - run: node --test ci/t015/disposable-ledger-check.test.mjs
      - run: node --check ci/t015/disposable-ledger-check.mjs
      - run: node --check ci/t015/fault-recovery-model.mjs
      - run: node --check ci/t015/patch-qa.mjs
